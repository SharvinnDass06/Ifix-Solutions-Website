<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFix Solutions - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h2, h3 { color: #0f172a; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0369a1; }
        .delete-btn { background-color: #dc2626; padding: 6px 12px; font-size: 14px; }
        .delete-btn:hover { background-color: #b91c1c; }
        .done-btn { background-color: #16a34a; padding: 6px 12px; font-size: 14px; margin-right: 5px; }
        .done-btn:hover { background-color: #15803d; }
        .cancel-btn { background-color: #ca8a04; padding: 6px 12px; font-size: 14px; margin-right: 5px; }
        .cancel-btn:hover { background-color: #a16207; }
        #message { margin-top: 15px; font-weight: bold; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e2e8f0; gap: 10px; }
        .repair-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status-Pending { background: #fef08a; color: #854d0e; }
        .status-Completed { background: #dcfce7; color: #166534; }
        .status-Cancelled { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 30px;">🛠️ iFix Solutions Admin Dashboard</h1>

    <!-- 1. Add New Product Section -->
    <div class="card">
        <h2>Add New Product to Catalog</h2>
        <form id="productForm">
            <div class="form-group">
                <label for="name">Product Name:</label>
                <input type="text" id="name" required placeholder="e.g. Kingston 8GB RAM">
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <input type="text" id="category" required placeholder="e.g. RAM, Storage, Laptop">
            </div>
            <div class="form-group">
                <label for="price">Price (RM):</label>
                <input type="number" step="0.01" id="price" required placeholder="e.g. 150.00">
            </div>
            <div class="form-group">
                <label for="image_url">Image URL:</label>
                <input type="text" id="image_url" placeholder="Paste image link here">
            </div>
            <div class="form-group">
                <label for="stock_quantity">Stock Quantity:</label>
                <input type="number" id="stock_quantity" required placeholder="e.g. 10">
            </div>
            <button type="submit">Add Product to Database</button>
        </form>
        <div id="message"></div>
    </div>

    <!-- 2. Manage Products Inventory Section -->
    <div class="card">
        <h2>Live Product Inventory & Deletion</h2>
        <div id="admin-product-list">
            <p style="color: #64748b;">Loading products...</p>
        </div>
    </div>

    <!-- 3. Customer Repair Bookings Section -->
    <div class="card">
        <h2>Customer Repair Bookings</h2>
        <div id="admin-repair-list">
            <p style="color: #64748b;">Loading repair bookings...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://ifix-solutions-backend-1.onrender.com';

        // --- Handle Product Form Submission ---
        const productForm = document.getElementById('productForm');
        const messageDiv = document.getElementById('message');

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const productData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                stock_quantity: document.getElementById('stock_quantity').value,
                image_url: document.getElementById('image_url').value
            };

            try {
                const response = await fetch(`${BACKEND_URL}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                const result = await response.json();

                if (result.success) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'Success! Product added to the database.';
                    productForm.reset();
                    loadAdminProducts();
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'Error: Could not add product.';
                }
            } catch (err) {
                console.error(err);
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Server connection error!';
            }
        });

        // --- Load & Display Admin Products ---
        async function loadAdminProducts() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/products`);
                const result = await response.json();
                const listContainer = document.getElementById('admin-product-list');
                listContainer.innerHTML = '';

                const products = result.data || result || [];
                if (products.length > 0) {
                    products.forEach(product => {
                        const item = document.createElement('div');
                        item.className = 'admin-item';
                        item.innerHTML = `
                            <span><strong>${product.name}</strong> - RM ${parseFloat(product.price).toFixed(2)} (Stock: ${product.stock_quantity})</span>
                            <button class="delete-btn" onclick="deleteProduct('${product.id}')">Delete</button>
                        `;
                        listContainer.appendChild(item);
                    });
                } else {
                    listContainer.innerHTML = '<p>No products found in database.</p>';
                }
            } catch (err) {
                console.error('Error loading products:', err);
                document.getElementById('admin-product-list').innerHTML = '<p style="color: red;">Error loading inventory.</p>';
            }
        }

        // --- Delete Product Function ---
        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`${BACKEND_URL}/api/products/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.success) {
                    alert('Product deleted successfully!');
                    loadAdminProducts();
                } else {
                    alert('Failed to delete: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error deleting product:', err);
                alert('Server error while deleting.');
            }
        }

        // --- Load Customer Repair Bookings ---
        async function loadAdminRepairs() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/repairs`);
                const result = await response.json();
                const repairContainer = document.getElementById('admin-repair-list');
                repairContainer.innerHTML = '';

                const repairs = result.data || result || [];
                if (repairs.length > 0) {
                    repairs.forEach(repair => {
                        const currentStatus = repair.status || 'Pending';
                        const card = document.createElement('div');
                        card.className = 'repair-card';
                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <span class="status-badge status-${currentStatus}">Status: ${currentStatus}</span>
                                <div>
                                    <button class="done-btn" onclick="updateRepairStatus('${repair.id}', 'Completed')">Mark Done</button>
                                    <button class="cancel-btn" onclick="updateRepairStatus('${repair.id}', 'Cancelled')">Cancel</button>
                                </div>
                            </div>
                            <p><strong>Customer:</strong> ${repair.full_name} (${repair.phone})</p>
                            <p><strong>Device:</strong> ${repair.device_model}</p>
                            <p><strong>Service Requested:</strong> ${repair.requested_service}</p>
                            <p><strong>Issue:</strong> ${repair.issue_description || 'None provided'}</p>
                        `;
                        repairContainer.appendChild(card);
                    });
                } else {
                    repairContainer.innerHTML = '<p>No repair bookings found in database.</p>';
                }
            } catch (err) {
                console.error('Error loading repairs:', err);
                document.getElementById('admin-repair-list').innerHTML = '<p style="color: red;">Error loading repair bookings.</p>';
            }
        }

        // --- Update Repair Status Function ---
        async function updateRepairStatus(id, newStatus) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/repairs/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const result = await response.json();

                if (result.success) {
                    loadAdminRepairs(); // Refresh list to show updated status badge
                } else {
                    alert('Failed to update status: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error updating status:', err);
                alert('Server error while updating status.');
            }
        }

        // Initial load when page opens
        loadAdminProducts();
        loadAdminRepairs();
    </script>
</body>
</html>
